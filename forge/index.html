<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — tâches d'équipe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff4d4d'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M11.5 16.5l3 3 6-6.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de studio, net et calme, tout se lit d'un coup d'œil
   IDEA: le tableau de production d'une équipe de jeu vidéo, sur un fond d'égaliseur de DJ
   PICTURE: la liste de tâches en lignes claires; derrière, des barres rouges qui battent
   COLOUR and TYPE: anthracite, texte blanc, un seul accent rouge; Inter partout
   LAYOUT: onglets en haut sur ordinateur, barre d'onglets en bas sur téléphone */
:root{color-scheme:dark;--bg:#0f1013;--panel:#17191e;--raise:#1f2229;--line:#2c3039;--ink:#f3f4f6;--mute:#a4a9b4;--red:#ff4d4d;--redbg:#3a1618;--amber:#f5b942;--amberbg:#3a2c10}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.15;font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#eq{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,nav,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:12px;padding:14px max(4vw,16px);border-bottom:1px solid var(--line);background:rgba(23,25,30,.88);backdrop-filter:blur(8px)}
.logo{width:38px;height:38px;flex:none}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;font-size:13px;color:var(--mute)}
.hr{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:99px;min-height:40px;padding:4px 14px 4px 6px;font-weight:600;font-size:15px;max-width:240px}
.hbtn.mus{padding:4px 14px}
.hbtn .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn.on{border-color:var(--red)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--raise);display:inline-grid;place-items:center;color:#fff}
.av svg.i{width:60%;height:60%}
nav{display:flex;gap:4px;padding:0 max(4vw,16px);background:rgba(23,25,30,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:14px 16px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--red)}
nav .b{font-size:12px;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
main{max-width:1000px;margin:0 auto;padding:24px max(4vw,16px) 120px}
.view{display:none}.view.on{display:block}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vh h2{font-size:28px;flex:1;text-shadow:0 2px 12px #000}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
input[type=text],input[type=email],input[type=password]{min-height:44px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;width:100%}
.dd{position:relative}
.bar .dd{min-width:min(240px,100%)}
.ddb{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:left;font-weight:500}
.ddb .lb{flex:1;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ddb[aria-expanded=true]{border-color:var(--red)}
.ddb .chev{transition:transform .15s}.ddb[aria-expanded=true] .chev{transform:rotate(180deg)}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;max-height:320px;overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -10px #000;z-index:20;padding:5px}
.ddm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;min-height:42px;padding:6px 10px;text-align:left;white-space:nowrap}
.ddm button:hover,.ddm button:focus-visible{background:#2a2e37;outline:0}
.ddm button.on{color:#ff8080;font-weight:700}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;min-height:38px;padding:4px 14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.grp{margin-bottom:26px}
.grp h3{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:8px;text-shadow:0 1px 8px #000}
.grp h3 .dot{width:9px;height:9px;border-radius:50%}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.done .tt{text-decoration:line-through;color:var(--mute)}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid #4a4f5a;background:none;display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0}
.chk.on{background:var(--red);border-color:var(--red)}.chk.on svg{opacity:1}
.chk:disabled{opacity:.35;cursor:not-allowed}
.ico{width:40px;height:40px;border-radius:10px;background:var(--raise);display:grid;place-items:center;color:var(--ink);flex:none}
.tb{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.tb:hover .tt{text-decoration:underline;text-decoration-color:var(--red)}
.tt{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--mute);overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clip{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:600}
.clip svg.i{width:15px;height:15px}
.side{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:13px;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap}
.u1{background:var(--redbg);color:#ff8080}.u2{background:var(--amberbg);color:var(--amber)}.u3{background:var(--raise);color:var(--mute)}
.dif{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);white-space:nowrap}
.dif span{display:inline-flex;gap:2px}.dif i{width:6px;height:12px;border-radius:2px;background:#3a3f4a}.dif i.f{background:var(--ink)}
.who{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.who .av{width:24px;height:24px}
.del{border:0;background:none;color:var(--mute);border-radius:8px;min-width:36px;height:36px;display:grid;place-items:center;padding:0 6px;font-weight:700;font-size:13px}
.del:hover{color:var(--red);background:var(--raise)}
.del.sure{background:var(--red);color:#fff;padding:0 12px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.forms{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px}
.card h3{font-size:19px}
.f{display:grid;gap:7px;font-size:14px;font-weight:600;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.icons button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 4px 7px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}
.icons button.on{border-color:var(--red);color:var(--ink);background:var(--redbg)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.cols button.on{border-color:var(--ink)}
.btn{min-height:46px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;padding:8px 20px}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;min-height:38px;padding:4px 14px;font-weight:600;font-size:14px}
.ghost:hover{background:var(--raise)}
.drop{display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:18px 12px;color:var(--mute);font-size:14px;font-weight:500;cursor:pointer;background:var(--bg)}
.drop b{color:var(--ink);font-size:15px}
.drop.over{border-color:var(--red);background:var(--redbg)}
.drop input{display:none}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fl{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise)}
.fl .th{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0b0c0f;border:0;padding:0}
.fl .fi{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mute)}
.fl .fn{font-size:12px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.fl .rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:#000c;color:#fff;display:grid;place-items:center;padding:0}
.fl .rm svg.i{width:14px;height:14px}
.fl a{color:inherit;text-decoration:none;display:block}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.acts{display:flex;gap:6px;align-items:center}
.note{font-size:14px;color:var(--mute);margin-top:16px}
.prof{display:flex;align-items:center;gap:16px}
.prof .av{width:72px;height:72px}
.ov{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:22px;display:grid;gap:18px}
.mh{display:flex;align-items:flex-start;gap:12px}
.mh h3{font-size:22px;flex:1;overflow-wrap:anywhere;padding-top:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:15px;align-items:center}
.kv dt{color:var(--mute);font-weight:600}.kv dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb2{position:fixed;inset:0;z-index:40;background:#000e;display:grid;place-items:center;padding:16px;border:0;width:100%}
.lb2 img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;max-width:min(92vw,520px);z-index:50;display:none}
@media(max-width:700px){
  header{padding:12px 16px}.brand p{display:none}.hbtn .tn{display:none}.hbtn{padding:4px 6px}.hbtn.mus{padding:4px 10px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:5;border-top:1px solid var(--line);border-bottom:0;padding:0 0 env(safe-area-inset-bottom);gap:0;overflow:visible;background:rgba(23,25,30,.97)}
  nav button{flex:1;flex-direction:column;gap:2px;padding:9px 2px 8px;font-size:12px;border-bottom:0;border-top:2px solid transparent;position:relative}
  nav button.on{border-top-color:var(--red)}
  nav .b{position:absolute;top:4px;left:calc(50% + 6px);font-size:11px;padding:0 5px;line-height:16px}
  main{padding:18px 14px 120px}
  .vh h2{font-size:24px}
  .row{grid-template-columns:auto minmax(0,1fr) auto;padding:12px}
  .row .ico{display:none}
  .row .side{grid-column:2/4;grid-row:2;justify-content:flex-start;gap:8px 12px}
  .row>.del,.row>.ph{grid-column:3;grid-row:1}
  .forms,.two{grid-template-columns:minmax(0,1fr)}
  .ov{padding:0}.modal{max-height:100%;height:100%;border-radius:0;align-content:start}
  .toast{bottom:84px}
}
@media(prefers-reduced-motion:reduce){.ddb .chev{transition:none}}
[hidden]{display:none!important}
.out .in-only{display:none!important}
.authc{max-width:440px;margin:6vh auto 0}
.authc .seg{width:100%}.authc .seg button{flex:1}
#amsg:empty{display:none}
</style>
</head>
<body class="out">
<canvas id="eq" aria-hidden="true"></canvas>
<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff4d4d"/><path d="M16 5l9 5v12l-9 5-9-5V10z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M11.5 16.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="brand"><h1>Forge</h1><p>Les tâches de l'équipe</p></div>
  <div class="hr">
    <button type="button" class="hbtn mus" id="musb" title="Choisir une musique pour faire danser les barres"></button>
    <input type="file" id="musf" accept="audio/*" hidden>
    <button type="button" class="hbtn in-only" id="meb" data-tab="profil" title="Mon compte"></button>
  </div>
</header>
<nav id="nav" class="in-only"></nav>
<main>
  <section class="view on" id="v-auth">
    <form class="card authc" id="aform" autocomplete="on">
      <div class="seg" id="amode"><button type="button" data-am="in" class="on">Se connecter</button><button type="button" data-am="up">Créer un compte</button></div>
      <h3 id="atitle">Connexion</h3>
      <label class="f" id="apseudo-l" hidden>Pseudo<input type="text" id="apseudo" maxlength="30" autocomplete="nickname" placeholder="Ex. : PixelMaster"></label>
      <label class="f">E-mail<input type="email" id="aemail" required autocomplete="email" placeholder="toi@exemple.fr"></label>
      <label class="f">Mot de passe<input type="password" id="apass" required minlength="6" autocomplete="current-password" placeholder="6 caractères minimum"></label>
      <button class="btn" type="submit" id="abtn">Se connecter</button>
      <p class="sub" id="amsg" style="margin:0"></p>
    </form>
  </section>
  <section class="view" id="v-taches">
    <div class="vh"><h2>Toutes les tâches</h2></div>
    <div class="bar"><div class="dd" id="flist"></div><div class="seg" id="fstat"></div></div>
    <div id="tasks"></div>
  </section>
  <section class="view" id="v-moi">
    <div class="vh"><h2>Mes tâches</h2></div>
    <div class="bar"><div class="seg" id="mstat"></div></div>
    <div id="mine"></div>
  </section>
  <section class="view" id="v-creer">
    <div class="vh"><h2>Créer</h2></div>
    <div class="forms">
      <form class="card" id="tform" autocomplete="off">
        <h3>Nouvelle tâche</h3>
        <label class="f">Titre<input type="text" id="ttitle" maxlength="120" placeholder="Ex. : Texturer le décor du niveau 1"></label>
        <div class="two">
          <div class="f">Liste<div class="dd" id="tlist"></div></div>
          <div class="f">Pour qui<div class="dd" id="twho"></div></div>
        </div>
        <div class="f">Icône<div class="icons" id="ticons"></div></div>
        <div class="f">Difficulté<div class="seg" id="tdiff"></div></div>
        <div class="f">Délai<div class="seg" id="turg"></div></div>
        <div class="f">Pièces jointes
          <label class="drop" id="tdrop"><input type="file" id="tfile" multiple><b>Ajouter des fichiers</b>Clique, glisse un fichier ici, ou colle une capture d’écran (Ctrl+V)</label>
          <div class="files" id="tpend"></div>
        </div>
        <button class="btn" id="taddb" type="submit">Ajouter la tâche</button>
      </form>
      <form class="card" id="lform" autocomplete="off">
        <h3>Nouvelle liste</h3>
        <label class="f">Nom<input type="text" id="lname" maxlength="60" placeholder="Ex. : Modélisation, Niveau 1…"></label>
        <div class="f">Icône<div class="icons" id="licons"></div></div>
        <button class="btn" id="laddb" type="submit">Créer la liste</button>
      </form>
    </div>
  </section>
  <section class="view" id="v-listes">
    <div class="vh"><h2>Listes</h2></div>
    <div id="lists"></div>
  </section>
  <section class="view" id="v-equipe">
    <div class="vh"><h2>Équipe</h2></div>
    <div id="team"></div>
  </section>
  <section class="view" id="v-profil">
    <div class="vh"><h2>Mon compte</h2></div>
    <form class="card" id="pform" autocomplete="off" style="max-width:640px"></form>
    <div class="card" style="max-width:640px;margin-top:16px"><div class="acts" style="justify-content:space-between;flex-wrap:wrap"><span class="sub" id="pemail"></span><button type="button" class="ghost" id="logout">Se déconnecter</button></div></div>
  </section>
  <p class="note" id="status"></p>
</main>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
{

const eq={cv:$('eq'),bars:[],an:null,buf:null,audio:null,ctx:null};
{
  const cv=eq.cv,g=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1;
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)};
  addEventListener('resize',size);size();
  const frame=ts=>{
    const t=ts/1000,bw=W<700?6:9,gap=W<700?4:6,n=Math.ceil(W/(bw+gap)),maxH=H*0.55;
    let data=null;if(eq.an&&eq.audio&&!eq.audio.paused){eq.an.getByteFrequencyData(eq.buf);data=eq.buf}
    const beat=Math.exp(-((t*2.05)%1)*6),beat2=Math.exp(-((t*2.05+0.5)%1)*9)*0.5;
    g.clearRect(0,0,W,H);
    for(let i=0;i<n;i++){
      let v;
      if(data){const bin=Math.min(data.length-1,Math.floor(Math.pow(i/n,1.7)*data.length*0.85));v=data[bin]/255;v=v*v*1.15}
      else if(still)v=0.12+0.1*Math.abs(Math.sin(i*1.7));
      else{const x=i/n,low=Math.max(0,1-x*2.2);v=0.08+0.16*(0.5+0.5*Math.sin(t*3.1+i*0.55))*(0.5+0.5*Math.sin(t*1.3-i*0.21))+0.42*beat*low+0.18*beat2*(1-low)*(0.5+0.5*Math.sin(i*2.3+t*5))}
      const prev=eq.bars[i]||0,nv=v>prev?v:prev*0.9+v*0.1;eq.bars[i]=nv;
      const h=Math.max(3,nv*maxH),x=i*(bw+gap),y=H-h;
      const gr=g.createLinearGradient(0,y,0,H);gr.addColorStop(0,'rgba(255,77,77,0.30)');gr.addColorStop(1,'rgba(255,77,77,0.04)');
      g.fillStyle=gr;g.fillRect(x,y,bw,h);
      g.fillStyle='rgba(255,120,120,0.45)';g.fillRect(x,y-4,bw,2);
    }
    if(!still||data)requestAnimationFrame(frame);else eq.run=false;
  };
  eq.start=()=>{if(!eq.run){eq.run=true;requestAnimationFrame(frame)}};
  eq.start();
}

  if(a)b.querySelector('.tn').textContent=eq.name;b.classList.toggle('on',!!(a&&!a.paused))};

  const cnt=f=>{const a=tasks.filter(f);const d=a.filter(t=>doneAt(t)).length;return (a.length-d)+' à faire · '+d+' faite'+(d>1?'s':'')};
  $('lists').innerHTML=!loaded?'<div class="empty"><b>Chargement…</b></div>':!lists.length?'<div class="empty"><b>Aucune liste</b>Crée-en une dans l’onglet Créer.</div>':'<div class="rows">'+lists.map(l=>'<div class="lrow"><div class="ico">'+svg(l.icon)+'</div><div><div class="tt">'+esc(l.name)+'</div><div class="sub">'+cnt(t=>t.list===l.key)+' · créée par '+esc(nm(l.uid))+'</div></div><div class="acts"><button type="button" class="ghost" data-open="'+esc(l.key)+'">Voir</button>'+(l.uid===me?'<button type="button" class="del'+(armed==='L'+l.key?' sure':'')+'" data-dl="'+esc(l.key)+'" aria-label="Supprimer la liste">'+(armed==='L'+l.key?'Supprimer ?':sv(P.trash))+'</button>':'')+'</div></div>').join('')+'</div>';
  $('team').innerHTML=!loaded?'<div class="empty"><b>Chargement…</b></div>':'<div class="rows">'+mem.map(id=>'<div class="lrow">'+avH(id,40)+'<div><div class="tt">'+esc(nm(id))+(id===me?' <span class="sub" style="display:inline">(toi)</span>':'')+'</div><div class="sub">'+cnt(t=>t.who===id)+'</div></div><span></span></div>').join('')+'</div>';
  $('pemail').textContent=session.user.email?'Connecté avec '+session.user.email:'';
  if(tab==='profil'&&loaded&&!$('pform').childElementCount)paintProf($('pform'),false);
  renderModal();
}

function renderModal(){
  const box=$('modal');
  const firstRun=loaded&&!(PR[me]&&PR[me].pseudo)&&!later&&tab!=='profil';
  if(firstRun&&!openT){
    if(!box.querySelector('#oform')){prof=null;box.innerHTML='<div class="ov"><form class="modal" id="oform" autocomplete="off"></form></div>';paintProf($('oform'),true)}
    return;
  }
  const t=openT&&findT(openT);
  if(!t){openT=null;box.innerHTML='';return}
  const lists=allLists(),l=lists.find(x=>x.key===t.list),files=t.files,mine=t.uid===me,u=t.urg||3,d=t.diff||1,done=!!doneAt(t);
  box.innerHTML='<div class="ov" data-close="1"><div class="modal" role="dialog" aria-modal="true">'+
   '<div class="mh"><div class="ico">'+svg(t.icon)+'</div><h3 id="mtitle"></h3><button type="button" class="del" data-close="1" aria-label="Fermer">'+sv(P.x)+'</button></div>'+
   '<dl class="kv"><dt>Liste</dt><dd>'+esc(l?l.name:'Sans liste')+'</dd><dt>Délai</dt><dd><span class="chip u'+u+'">'+URG[u]+'</span></dd><dt>Difficulté</dt><dd><span class="dif"><span>'+[1,2,3].map(i=>'<i class="'+(i<=d?'f':'')+'"></i>').join('')+'</span>'+DIFF[d]+'</span></dd>'+
   '<dt>Pour</dt><dd class="who">'+(t.who?avH(t.who)+esc(nm(t.who)):'Tout le monde')+'</dd><dt>Ajoutée par</dt><dd class="who">'+avH(t.uid)+esc(nm(t.uid))+'</dd><dt>État</dt><dd>'+(done?'Faite':'À faire')+'</dd></dl>'+
   '<div class="f">Pièces jointes · '+files.length+(files.length?'<div class="files" id="mfiles">'+fileTiles(files,mine,'data-rf')+'</div>':'<div class="sub">Aucune pièce jointe.</div>')+'</div>'+
   (mine?'<label class="drop" id="mdrop"><input type="file" id="mfile" multiple><b>'+(busy?'Envoi en cours…':'Ajouter des pièces jointes')+'</b>Clique, glisse un fichier, ou colle une capture (Ctrl+V)</label>':'')+
   '</div></div>';
  $('mtitle').textContent=t.title;
  const mf=$('mfiles');if(mf)fillNames(mf,files);
  wireDrop($('mdrop'),fs=>addToTask(t,fs));
}

/* ---------- chargement ---------- */
async function signAll(){
  const need=new Set();
  for(const t of TASKS)for(const f of (Array.isArray(t.files)?t.files:[]))if(f&&f.path&&!URLS[f.path])need.add(f.path);
  for(const id in PR)if(PR[id].photo&&!URLS[PR[id].photo])need.add(PR[id].photo);
  if(!need.size)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls([...need],6*3600);
  (data||[]).forEach(d=>{if(d&&d.signedUrl&&d.path)URLS[d.path]=d.signedUrl});
}
async function loadAll(){
  const [p,l,t]=await Promise.all([sb.from('profiles').select('*'),sb.from('lists').select('*').order('created_at'),sb.from('tasks').select('*')]);
  const err=p.error||l.error||t.error;if(err)throw err;
  for(const k in PR)delete PR[k];p.data.forEach(r=>PR[r.id]=r);LISTS=l.data;TASKS=t.data;
  if(!PR[me]){const meta=(session.user.user_metadata||{});const row={id:me,pseudo:String(meta.pseudo||'').slice(0,30),icon:'gamedesign',color:'#ff4d4d'};
    const r=await sb.from('profiles').upsert(row).select().single();if(!r.error)PR[me]=r.data}
  await signAll().catch(()=>{});
  loaded=true;$('status').textContent='';render();
}
let rt;const reload=()=>{clearTimeout(rt);rt=setTimeout(()=>loadAll().catch(e=>toast(frErr(e))),200)};
setInterval(()=>{if(session){for(const k in URLS)delete URLS[k];reload()}},5*3600*1000);
async function run(fn){try{await fn()}catch(e){console.warn(e);toast(frErr(e))}finally{reload()}}
const chk=r=>{if(r&&r.error)throw r.error;return r};

/* ---------- pièces jointes ---------- */
function prep(fs){const out=[];for(const f of fs){if(f.size>MAXB){toast('« '+(f.name||'fichier')+' » dépasse 50 Mo.');continue}
  const name=f.name&&f.name!=='image.png'?f.name:'capture-'+new Date().toLocaleString('fr-FR').replace(/[/: ]/g,'-').replace(/,/g,'')+'.png';
  out.push({file:f,type:f.type||'application/octet-stream',name})}return out}
async function upload(p){
  const ext=(p.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)||'bin';
  const path=me+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  chk(await sb.storage.from(BUCKET).upload(path,p.file,{contentType:p.type,upsert:false}));
  return {path,name:p.name.slice(0,120),type:p.type,size:p.file.size};
}
function wireDrop(el,cb){if(!el||el._w)return;el._w=1;
  el.querySelector('input').addEventListener('change',e=>{cb([...e.target.files]);e.target.value=''});
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');cb([...e.dataTransfer.files])})}
const addPend=fs=>{for(const p of prep(fs)){if(p.type.startsWith('image/'))p.local=URL.createObjectURL(p.file);pend.push(p)}render()};
wireDrop($('tdrop'),addPend);
function addToTask(t,fs){
  const list=prep(fs);if(!list.length||busy)return;busy=true;renderModal();
  run(async()=>{try{const up=[];for(const p of list)up.push(await upload(p));
    const cur=findT(t.key);chk(await sb.from('tasks').update({files:[...((cur&&cur.files)||[]),...up]}).eq('id',t.id));
    toast(up.length>1?up.length+' fichiers ajoutés':'Fichier ajouté')}finally{busy=false}});
}
document.addEventListener('paste',e=>{
  if(!session)return;const fs=[...(e.clipboardData&&e.clipboardData.files||[])];if(!fs.length)return;
  if(openT){const t=findT(openT);if(t&&t.uid===me){e.preventDefault();addToTask(t,fs)}return}
  if(tab==='creer'){e.preventDefault();addPend(fs);toast('Capture ajoutée à la tâche')}
});

/* ---------- clics ---------- */
document.addEventListener('click',ev=>{
  if(openDD&&!ev.target.closest('.dd')){openDD=null;ddAll()}
  const b=ev.target.closest('button,[data-close]');if(!b)return;
  const ds=b.dataset;
  if(ds.close&&(b.tagName==='BUTTON'||ev.target===b)){openT=null;renderModal();return}
  if(b.tagName!=='BUTTON')return;
  if(ds.am){amode=ds.am;paintAuth();return}
  if(ds.zoom){const z=document.createElement('button');z.className='lb2';z.type='button';z.setAttribute('aria-label','Fermer');const im=document.createElement('img');im.src=ds.zoom;im.alt='';z.appendChild(im);z.onclick=()=>z.remove();document.body.appendChild(z);return}
  if(ds.dd){openDD=openDD===ds.dd?null:ds.dd;ddAll();if(openDD){const o=$(openDD).querySelector('.ddm .on')||$(openDD).querySelector('.ddm button');o&&o.focus()}return}
  if(ds.ddo){dd[ds.ddo].v=ds.val;openDD=null;ddAll();$(ds.ddo).querySelector('.ddb').focus();if(ds.ddo==='flist')render();return}
  if(ds.tab){location.hash=ds.tab;setTab(ds.tab);return}
  if(ds.t){openT=ds.t;armed=null;renderModal();return}
  if(ds.li){licon=ds.li;pickers();return}
  if(ds.ti){ticon=ds.ti;pickers();return}
  if(ds.d){tdiff=+ds.d;pickers();return}
  if(ds.u){turg=+ds.u;pickers();return}
  if(ds.fs){fstat=ds.fs;pickers();render();return}
  if(ds.ms){mstat=ds.ms;pickers();render();return}
  if(ds.pi){prof.icon=ds.pi;prof.photo='';rerenderProf();return}
  if(ds.pc){prof.color=ds.pc;rerenderProf();return}
  if(ds.pnophoto){prof.photo='';rerenderProf();return}
  if(ds.later){later=true;renderModal();return}
  if(ds.rp){const p=pend.splice(+ds.rp,1)[0];if(p&&p.local)URL.revokeObjectURL(p.local);render();return}
  if(ds.rf){const t=findT(openT);if(!t||t.uid!==me)return;const files=[...t.files];const gone=files.splice(+ds.rf,1)[0];
    run(async()=>{chk(await sb.from('tasks').update({files}).eq('id',t.id));if(gone&&gone.path)await sb.storage.from(BUCKET).remove([gone.path])});return}
  if(ds.open){dd.flist.v=ds.open;location.hash='taches';setTab('taches');return}
  if(ds.c){const id=ds.c,row=TASKS.find(x=>x.id===id);if(row){row.done_at=row.done_at?null:new Date().toISOString();render()}
    run(async()=>chk(await sb.rpc('toggle_done',{tid:id})));return}
  if(ds.x){if(armed!==ds.x){armed=ds.x;render();return}
    armed=null;const t=findT(ds.x);if(!t)return;TASKS=TASKS.filter(x=>x.id!==t.id);render();
    run(async()=>{chk(await sb.from('tasks').delete().eq('id',t.id));const paths=t.files.map(f=>f.path).filter(Boolean);if(paths.length)await sb.storage.from(BUCKET).remove(paths)});return}
  if(ds.dl){if(armed!=='L'+ds.dl){armed='L'+ds.dl;render();return}
    armed=null;const id=ds.dl;const mt=allTasks().filter(t=>t.list===id&&t.uid===me);
    run(async()=>{const paths=mt.flatMap(t=>t.files.map(f=>f.path)).filter(Boolean);
      if(mt.length)chk(await sb.from('tasks').delete().in('id',mt.map(t=>t.id)));
      chk(await sb.from('lists').delete().eq('id',id));if(paths.length)await sb.storage.from(BUCKET).remove(paths)});return}
});
$('logout').addEventListener('click',()=>sb.auth.signOut());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const z=document.querySelector('.lb2');if(z){z.remove();return}if(openDD){const id=openDD;openDD=null;ddAll();$(id).querySelector('.ddb').focus();return}if(openT){openT=null;renderModal()}}
  if(openDD&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const bs=[...$(openDD).querySelectorAll('.ddm button')];const i=bs.indexOf(document.activeElement);const n=bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length];n&&n.focus()}
});
function rerenderProf(){const el=tab==='profil'?$('pform'):$('oform');if(el)paintProf(el,el.id==='oform')}
document.addEventListener('input',e=>{if(e.target.id==='ppseudo'&&prof){prof.pseudo=e.target.value;const p=e.target.closest('form').querySelector('#pprev');if(p)p.textContent=e.target.value.trim()||'Ton pseudo'}});
document.addEventListener('change',async e=>{
  if(e.target.id!=='pphoto')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!/^image\//.test(f.type)){toast('Choisis une image.');return}
  const p=prep([f])[0];if(!p)return;busy=true;rerenderProf();
  try{const r=await upload(p);const {data}=await sb.storage.from(BUCKET).createSignedUrl(r.path,6*3600);if(data)URLS[r.path]=data.signedUrl;prof.photo=r.path}
  catch(err){toast(frErr(err))}finally{busy=false;rerenderProf()}
});
document.addEventListener('submit',e=>{
  const f=e.target;if(f.id!=='pform'&&f.id!=='oform')return;e.preventDefault();
  const pseudo=(prof.pseudo||'').trim().slice(0,30);if(!pseudo){f.querySelector('#ppseudo').focus();toast('Choisis un pseudo.');return}
  const old=PR[me]||{},row={id:me,pseudo,icon:prof.icon,color:prof.color,photo:prof.photo||''};
  PR[me]={...old,...row};prof=null;
  if(f.id==='oform')$('modal').innerHTML='';
  if(tab==='profil')$('pform').innerHTML='';
  run(async()=>{chk(await sb.from('profiles').upsert(row));toast('Compte enregistré');if(old.photo&&old.photo!==row.photo)await sb.storage.from(BUCKET).remove([old.photo])});
  render();
});
$('lform').addEventListener('submit',e=>{
  e.preventDefault();const n=$('lname').value.trim();if(!n){$('lname').focus();return}
  $('lname').value='';
  run(async()=>{const r=chk(await sb.from('lists').insert({owner:me,name:n.slice(0,60),icon:licon}).select().single());dd.tlist.v=r.data.id;toast('Liste « '+n.slice(0,60)+' » créée')});
});
$('tform').addEventListener('submit',e=>{
  e.preventDefault();const title=$('ttitle').value.trim(),list=dd.tlist.v;
  if(!title){$('ttitle').focus();return}
  if(!list||busy)return;
  const row={owner:me,title:title.slice(0,120),icon:ticon,diff:tdiff,urg:turg,assignee:dd.twho.v||null,list_id:list,files:[]};
  const toUp=pend;pend=[];busy=true;$('ttitle').value='';$('taddb').textContent=toUp.length?'Envoi des fichiers…':'Ajout…';render();
  run(async()=>{try{for(const p of toUp){row.files.push(await upload(p));if(p.local)URL.revokeObjectURL(p.local)}
    chk(await sb.from('tasks').insert(row));toast('Tâche ajoutée')}
    catch(err){pend=toUp;$('ttitle').value=title;throw err}
    finally{busy=false;$('taddb').textContent='Ajouter la tâche'}});
});

/* ---------- connexion ---------- */
function paintAuth(){
  [...$('amode').children].forEach(b=>b.classList.toggle('on',b.dataset.am===amode));
  $('atitle').textContent=amode==='in'?'Connexion':'Créer un compte';
  $('apseudo-l').hidden=amode!=='up';$('abtn').textContent=amode==='in'?'Se connecter':'Créer mon compte';
  $('apass').autocomplete=amode==='in'?'current-password':'new-password';$('amsg').textContent='';
}
paintAuth();
$('aform').addEventListener('submit',async e=>{
  e.preventDefault();if(!sb)return;const email=$('aemail').value.trim(),password=$('apass').value,msg=$('amsg');
  $('abtn').disabled=true;msg.textContent='';
  try{
    if(amode==='in'){chk(await sb.auth.signInWithPassword({email,password}))}
    else{const pseudo=$('apseudo').value.trim().slice(0,30);if(!pseudo){msg.textContent='Choisis un pseudo.';$('apseudo').focus();return}
      const r=chk(await sb.auth.signUp({email,password,options:{data:{pseudo},emailRedirectTo:location.href.split('#')[0]}}));
      if(!r.data.session){msg.textContent='Compte créé ! Ouvre le lien reçu par e-mail pour le confirmer, puis connecte-toi.';amode='in';paintAuth();msg.textContent='Compte créé ! Ouvre le lien reçu par e-mail pour le confirmer, puis connecte-toi.'}}
  }catch(err){msg.textContent=frErr(err)}finally{$('abtn').disabled=false}
});
function onSession(s){
  const was=me;session=s;me=s?s.user.id:null;
  if(!s){loaded=false;LISTS=[];TASKS=[];for(const k in PR)delete PR[k];if(chan){sb.removeChannel(chan);chan=null}setTab('auth');return}
  if(was===me)return;
  loaded=false;later=false;
  if(!chan)chan=sb.channel('forge').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},reload).on('postgres_changes',{event:'*',schema:'public',table:'lists'},reload).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},reload).subscribe();
  setTab(location.hash.slice(1));$('status').textContent='Chargement…';
  loadAll().catch(e=>{$('status').textContent='Impossible de charger les données : '+frErr(e)});
}
addEventListener('hashchange',()=>{if(session)setTab(location.hash.slice(1))});
if(!sb){$('amsg').textContent=window.supabase?'Le site n’est pas encore configuré : remplis config.js (voir README).':'Impossible de charger Supabase. Vérifie ta connexion.';$('abtn').disabled=true;render()}
else{sb.auth.getSession().then(({data})=>onSession(data.session));sb.auth.onAuthStateChange((_e,s)=>onSession(s))}
}
</script>
</body>
