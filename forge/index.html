<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — tâches d'équipe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff4d4d'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M11.5 16.5l3 3 6-6.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de studio, net et calme, tout se lit d'un coup d'œil
   IDEA: le tableau de production d'une équipe de jeu vidéo, sur un fond d'égaliseur de DJ
   PICTURE: la liste de tâches en lignes claires; derrière, des barres rouges qui battent
   COLOUR and TYPE: anthracite, texte blanc, un seul accent rouge; Inter partout
   LAYOUT: onglets en haut sur ordinateur, barre d'onglets en bas sur téléphone */
:root{color-scheme:dark;--bg:#0f1013;--panel:#17191e;--raise:#1f2229;--line:#2c3039;--ink:#f3f4f6;--mute:#a4a9b4;--red:#ff4d4d;--redbg:#3a1618;--amber:#f5b942;--amberbg:#3a2c10}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.15;font-weight:700}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#eq{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,nav,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:12px;padding:14px max(4vw,16px);border-bottom:1px solid var(--line);background:rgba(23,25,30,.88);backdrop-filter:blur(8px)}
.logo{width:38px;height:38px;flex:none}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;font-size:13px;color:var(--mute)}
.hr{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:99px;min-height:40px;padding:4px 14px 4px 6px;font-weight:600;font-size:15px;max-width:240px}
.hbtn.mus{padding:4px 14px}
.hbtn .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn.on{border-color:var(--red)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;background:var(--raise);display:inline-grid;place-items:center;color:#fff}
.av svg.i{width:60%;height:60%}
nav{display:flex;gap:4px;padding:0 max(4vw,16px);background:rgba(23,25,30,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:14px 16px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--red)}
nav .b{font-size:12px;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
main{max-width:1000px;margin:0 auto;padding:24px max(4vw,16px) 120px}
.view{display:none}.view.on{display:block}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vh h2{font-size:28px;flex:1;text-shadow:0 2px 12px #000}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
input[type=text],input[type=email],input[type=password]{min-height:44px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;width:100%}
.dd{position:relative}
.bar .dd{min-width:min(240px,100%)}
.ddb{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:left;font-weight:500}
.ddb .lb{flex:1;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ddb[aria-expanded=true]{border-color:var(--red)}
.ddb .chev{transition:transform .15s}.ddb[aria-expanded=true] .chev{transform:rotate(180deg)}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;max-height:320px;overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -10px #000;z-index:20;padding:5px}
.ddm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:8px;min-height:42px;padding:6px 10px;text-align:left;white-space:nowrap}
.ddm button:hover,.ddm button:focus-visible{background:#2a2e37;outline:0}
.ddm button.on{color:#ff8080;font-weight:700}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;min-height:38px;padding:4px 14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
.grp{margin-bottom:26px}
.grp h3{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:8px;text-shadow:0 1px 8px #000}
.grp h3 .dot{width:9px;height:9px;border-radius:50%}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.done .tt{text-decoration:line-through;color:var(--mute)}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid #4a4f5a;background:none;display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0}
.chk.on{background:var(--red);border-color:var(--red)}.chk.on svg{opacity:1}
.chk:disabled{opacity:.35;cursor:not-allowed}
.ico{width:40px;height:40px;border-radius:10px;background:var(--raise);display:grid;place-items:center;color:var(--ink);flex:none}
.tb{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.tb:hover .tt{text-decoration:underline;text-decoration-color:var(--red)}
.tt{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--mute);overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clip{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:600}
.clip svg.i{width:15px;height:15px}
.side{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:13px;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap}
.u1{background:var(--redbg);color:#ff8080}.u2{background:var(--amberbg);color:var(--amber)}.u3{background:var(--raise);color:var(--mute)}
.dif{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);white-space:nowrap}
.dif span{display:inline-flex;gap:2px}.dif i{width:6px;height:12px;border-radius:2px;background:#3a3f4a}.dif i.f{background:var(--ink)}
.who{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap}
.who .av{width:24px;height:24px}
.del{border:0;background:none;color:var(--mute);border-radius:8px;min-width:36px;height:36px;display:grid;place-items:center;padding:0 6px;font-weight:700;font-size:13px}
.del:hover{color:var(--red);background:var(--raise)}
.del.sure{background:var(--red);color:#fff;padding:0 12px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.forms{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px}
.card h3{font-size:19px}
.f{display:grid;gap:7px;font-size:14px;font-weight:600;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.icons button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 4px 7px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}
.icons button.on{border-color:var(--red);color:var(--ink);background:var(--redbg)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.cols button.on{border-color:var(--ink)}
.btn{min-height:46px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;padding:8px 20px}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;min-height:38px;padding:4px 14px;font-weight:600;font-size:14px}
.ghost:hover{background:var(--raise)}
.drop{display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:18px 12px;color:var(--mute);font-size:14px;font-weight:500;cursor:pointer;background:var(--bg)}
.drop b{color:var(--ink);font-size:15px}
.drop.over{border-color:var(--red);background:var(--redbg)}
.drop input{display:none}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fl{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise)}
.fl .th{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0b0c0f;border:0;padding:0}
.fl .fi{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mute)}
.fl .fn{font-size:12px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.fl .rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:#000c;color:#fff;display:grid;place-items:center;padding:0}
.fl .rm svg.i{width:14px;height:14px}
.fl a{color:inherit;text-decoration:none;display:block}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.acts{display:flex;gap:6px;align-items:center}
.note{font-size:14px;color:var(--mute);margin-top:16px}
.prof{display:flex;align-items:center;gap:16px}
.prof .av{width:72px;height:72px}
.ov{position:fixed;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:22px;display:grid;gap:18px}
.mh{display:flex;align-items:flex-start;gap:12px}
.mh h3{font-size:22px;flex:1;overflow-wrap:anywhere;padding-top:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:15px;align-items:center}
.kv dt{color:var(--mute);font-weight:600}.kv dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb2{position:fixed;inset:0;z-index:40;background:#000e;display:grid;place-items:center;padding:16px;border:0;width:100%}
.lb2 img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;max-width:min(92vw,520px);z-index:50;display:none}
@media(max-width:700px){
  header{padding:12px 16px}.brand p{display:none}.hbtn .tn{display:none}.hbtn{padding:4px 6px}.hbtn.mus{padding:4px 10px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:5;border-top:1px solid var(--line);border-bottom:0;padding:0 0 env(safe-area-inset-bottom);gap:0;overflow:visible;background:rgba(23,25,30,.97)}
  nav button{flex:1;flex-direction:column;gap:2px;padding:9px 2px 8px;font-size:12px;border-bottom:0;border-top:2px solid transparent;position:relative}
  nav button.on{border-top-color:var(--red)}
  nav .b{position:absolute;top:4px;left:calc(50% + 6px);font-size:11px;padding:0 5px;line-height:16px}
  main{padding:18px 14px 120px}
  .vh h2{font-size:24px}
  .row{grid-template-columns:auto minmax(0,1fr) auto;padding:12px}
  .row .ico{display:none}
  .row .side{grid-column:2/4;grid-row:2;justify-content:flex-start;gap:8px 12px}
  .row>.del,.row>.ph{grid-column:3;grid-row:1}
  .forms,.two{grid-template-columns:minmax(0,1fr)}
  .ov{padding:0}.modal{max-height:100%;height:100%;border-radius:0;align-content:start}
  .toast{bottom:84px}
}
@media(prefers-reduced-motion:reduce){.ddb .chev{transition:none}}
[hidden]{display:none!important}
.out .in-only{display:none!important}
.authc{max-width:440px;margin:6vh auto 0}
.authc .seg{width:100%}.authc .seg button{flex:1}
#amsg:empty{display:none}
.pw{position:relative}.pw input{padding-right:52px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:40px;border:0;background:none;border-radius:8px;color:var(--mute);display:grid;place-items:center}
.eye:hover{color:var(--ink);background:#2a2e37}
/* ouverture */
.intro{position:fixed;inset:0;z-index:60;background:#0b0b0d;display:grid;place-items:center;transition:opacity .5s;cursor:pointer;overflow:hidden}
.intro.out{opacity:0;pointer-events:none}
.st{grid-area:1/1;display:grid;justify-items:center;gap:22px;text-align:center}
.st1{animation:stout .55s 2.9s ease forwards}
.ent{width:min(46vw,230px);height:auto;overflow:visible;animation:glow .8s 1.9s ease forwards}
.ent .k{fill:none;stroke:#ffae00;stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
.ent .fp{fill:#ffae00;opacity:0;animation:fadein .55s 1.75s ease forwards}
.by{color:#d9dbe0;font-size:20px;font-weight:600;opacity:0;transform:translateY(8px);animation:rise .6s 2s ease forwards}
.by b{color:#ffae00;font-weight:800}
.st2{opacity:0;animation:fadein .01s 3.25s forwards}
.flg{width:min(30vw,124px);height:auto;overflow:visible}
.flg rect{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-12deg);animation:pop .55s 3.3s cubic-bezier(.3,1.5,.5,1) forwards}
.flg .k2{fill:none;stroke:#fff;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s 3.7s ease forwards}
.flg .c{stroke-width:2.6;animation-delay:4.05s}
.ft{font-size:52px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1;opacity:0;transform:translateY(12px);animation:rise .5s 4.15s ease forwards}
.fs{color:#a4a9b4;font-size:16px;font-weight:600;opacity:0;animation:rise .5s 4.4s ease forwards;margin-top:-10px}
.skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));border:1px solid #2c3039;background:#17191e;border-radius:99px;min-height:40px;padding:4px 16px;font-weight:600;color:#a4a9b4}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{to{filter:drop-shadow(0 0 22px rgba(255,174,0,.5))}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes stout{to{opacity:0;transform:scale(.9)}}
@keyframes pop{to{transform:none}}
/* chargement */
.loader{display:grid;justify-items:center;gap:12px;padding:40px 20px;color:var(--mute);font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.loader svg{width:48px;height:48px;fill:none;stroke:var(--red);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.loader svg .k{stroke-dasharray:1;stroke-dashoffset:1;animation:lhex 1.8s ease-in-out infinite}
.loader svg .c{animation-delay:.3s}
@keyframes lhex{50%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.eqb{display:flex;gap:4px;height:22px;align-items:flex-end}
.eqb i{width:5px;height:5px;background:var(--red);border-radius:2px;animation:eqb .9s ease-in-out infinite}
.eqb i:nth-child(2){animation-delay:-.45s}.eqb i:nth-child(3){animation-delay:-.2s}.eqb i:nth-child(4){animation-delay:-.65s}.eqb i:nth-child(5){animation-delay:-.35s}
@keyframes eqb{0%,100%{height:5px}50%{height:22px}}
/* profil */
.pwrap{display:grid;gap:16px;max-width:760px}
.phero{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px 18px}
.phero .av{width:88px;height:88px}
.phero h3{font-size:26px;overflow-wrap:anywhere}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--raise);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}.stat span{font-size:13px;color:var(--mute)}
.psecs{display:grid;gap:16px}
.card h3 .h3s{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px 12px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.mrow .mn{flex:1 1 160px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.vol{display:flex;align-items:center;gap:14px}
.vol input{flex:1;accent-color:var(--red);height:28px;margin:0}
.vol b{min-width:52px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.savebar{position:sticky;bottom:16px;display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--raise);border:1px solid var(--red);border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 12px 30px -10px #000;z-index:4}
.savebar.show{display:flex}.savebar span{flex:1 1 180px;font-weight:600;color:var(--ink)}
/* interrupteur */
.sw{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--ink);cursor:pointer;font-size:15px;min-height:44px}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:99px;background:#3a3f4a;position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--red)}.sw input:checked::after{transform:translateX(20px)}
/* confirmation */
.cf{width:min(470px,100%)}
.cfi{width:46px;height:46px;border-radius:12px;background:var(--amberbg);color:var(--amber);display:grid;place-items:center}
.cf .acts{flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.savebar{bottom:76px}#confirm .ov{padding:16px}#confirm .modal{height:auto;border-radius:16px}}
@media(prefers-reduced-motion:reduce){.loader svg .k,.eqb i{animation:none;stroke-dashoffset:0;height:12px}}
/* catégories */
.cbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.cpills{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 2px 6px;scrollbar-width:thin}
.cpill{flex:none;display:flex;align-items:center;gap:9px;min-height:46px;padding:5px 15px 5px 6px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;color:var(--ink);white-space:nowrap}
.cpill:hover{background:var(--raise)}
.cpill .cdot{width:34px;height:34px;border-radius:50%;background:var(--cc);display:grid;place-items:center;color:#fff;flex:none}
.cpill .cdot svg.i{width:18px;height:18px}
.cpill.on{border-color:var(--cc);box-shadow:inset 0 0 0 1px var(--cc);background:var(--raise)}
.cpill .cc{font-size:12px;font-weight:700;background:var(--bg);border-radius:99px;padding:0 8px;color:var(--mute);line-height:20px}
.cpill.add{padding:5px 15px;color:var(--mute);border-style:dashed;gap:6px}
.cedit{flex:none;display:flex;align-items:center;gap:6px}
.dz,.ghost.dz{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
/* cloud explorateur */
.xp{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.xtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:#14161a}
.xi{min-width:44px;min-height:44px;padding:0;display:grid;place-items:center}
.xi:disabled{opacity:.35;cursor:default}
main.wide{max-width:1320px}
.xtool .ghost.ttog{display:none}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1 1 220px;min-width:0}
.crumbs button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--mute);font-weight:600;font-size:15px;max-width:220px}
.crumbs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{background:var(--raise);color:var(--ink)}
.crumbs button:last-child{color:var(--ink)}
.crumbs .sep{color:var(--mute)}
.xtool .seg button{display:flex;align-items:center;gap:6px;padding:4px 10px}
.xtool .ghost,.xtool label.btn{min-height:44px;display:inline-flex;align-items:center;gap:8px}
label.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
#cupl.dis{opacity:.4;pointer-events:none}
.xbody{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:420px}
.xtree{border-right:1px solid var(--line);padding:8px 6px;overflow:auto;max-height:70vh;background:#15171b}
.tnode{display:flex;align-items:center;gap:2px;padding-left:calc(var(--d)*16px);border-radius:8px}
.tnode.on{background:var(--redbg)}
.tnode.on .tl{color:#fff;font-weight:700}
.tw{width:28px;height:32px;border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:0;border-radius:6px;flex:none}
.tw svg.i{width:16px;height:16px;transition:transform .15s}
.tw.op svg.i{transform:rotate(0)}.tw:not(.op) svg.i{transform:rotate(-90deg)}
.tw:disabled{visibility:hidden}
.tl{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;min-height:36px;padding:4px 8px 4px 2px;border-radius:8px;text-align:left;color:var(--ink);font-weight:500;font-size:15px;min-width:0}
.tl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl svg.i{color:var(--amber);width:18px;height:18px}
.tl.root svg.i{color:var(--mute)}
.tnode:hover:not(.on){background:var(--raise)}
.cloudz{position:relative;min-height:320px;padding:8px}
.cloudz.over::after{content:"Dépose pour importer ici";position:absolute;inset:6px;border:2px dashed var(--red);border-radius:12px;background:rgba(58,22,24,.9);display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;z-index:6}
.dropon{outline:2px dashed var(--red)!important;outline-offset:-2px;background:var(--redbg)!important}
.chead,.crow{display:grid;grid-template-columns:44px minmax(0,1fr) 96px 130px 112px 40px;gap:4px 12px;align-items:center}
.chead{padding:4px 10px 8px;font-size:13px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line)}
.chead span:nth-child(3),.crow .csz{text-align:right}
.crow{padding:6px 10px;border-radius:10px;position:relative}
.crow:hover{background:#1d2027}
.crow .csz,.crow .cby,.crow .cdt{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .sub{display:none}
.crow .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cth{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none;background:var(--raise);color:var(--mute)}
.cth img{width:100%;height:100%;object-fit:cover}
.cth svg.i{width:24px;height:24px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ctile{position:relative;border:1px solid var(--line);border-radius:12px;background:#1a1d23;overflow:visible}
.ctile:hover{border-color:#3a3f4a}
.ctile .tb{padding:8px 8px 10px;display:grid;gap:8px}
.ctile .cth{width:100%;height:auto;aspect-ratio:1;border-radius:9px}
.ctile .cth svg.i{width:46%;height:46%;stroke-width:1.5}
.ctile .tt{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ctile .sub{font-size:12px}
.ctile>.del{position:absolute;top:6px;right:6px;background:#000a;color:#fff;width:34px;height:34px;min-width:0}
.ctile .cmenu{top:42px;right:6px}
.cmenu{position:absolute;right:6px;top:calc(100% - 4px);z-index:15;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:5px;min-width:210px;box-shadow:0 18px 40px -10px #000}
.cmenu.up{top:auto;bottom:calc(100% - 4px)}
.cmenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:8px;min-height:42px;padding:6px 10px;text-align:left;font-weight:500}
.cmenu button:hover,.cmenu button:focus-visible{background:#2a2e37;outline:0}
.cmenu button.dzi{color:#ff8080}
.cempty svg.i{width:44px;height:44px;margin:0 auto 10px;display:block}
.xfoot{padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);background:#14161a}
.modal.wide{width:min(960px,100%)}
.pv{width:100%;max-height:68vh;object-fit:contain;border-radius:10px;background:#000;display:block}
.pv.pdf{height:68vh;border:0;background:#fff}
.mvl{display:grid;gap:3px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:5px}
.mvl button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;min-height:42px;text-align:left;padding:6px 12px;font-weight:500}
.mvl button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvl button:hover{background:var(--raise)}
.mvl button.on{background:var(--redbg);color:#fff;font-weight:700}
/* recadrage */
.crop{position:relative;border-radius:12px;overflow:hidden;background:#000}
.crop canvas{display:block;width:100%;aspect-ratio:1;touch-action:none;cursor:grab}
.crop canvas:active{cursor:grabbing}
.cropb{display:flex;gap:8px;flex-wrap:wrap}
/* stockage */
.stg{display:grid;gap:6px}
.stgh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.stgh b{color:var(--ink);font-weight:600}
.stgb{height:10px;border-radius:99px;background:#2c3039;overflow:hidden;display:flex}
.stgb i{display:block;height:100%;background:#4da3ff}
.stgb i.add{background:repeating-linear-gradient(45deg,#ff7a5c 0 6px,#ff4d4d 6px 12px)}
.stg.warn .stgb i:first-child{background:var(--amber)}.stg.full .stgb i:first-child{background:var(--red)}
.stg .sub{font-size:13px}
.xfoot{display:grid;gap:10px}
.xfer .stg{border-top:1px solid var(--line);padding-top:10px}
.bigl{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.bigl li{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bigl li .cth{width:36px;height:36px}.bigl li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bigl li b{white-space:nowrap;font-size:14px;color:var(--mute)}
.backb{min-height:44px;display:inline-flex;align-items:center;gap:6px}
/* transferts */
.xfer{position:fixed;right:20px;bottom:20px;z-index:45;width:min(420px,calc(100vw - 24px));background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -12px #000;padding:14px 16px;display:grid;gap:10px}
.xfer[hidden]{display:none}
.xh{display:flex;align-items:center;gap:12px}
.xh .cth{width:40px;height:40px}
.xh b{flex:1;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.xbar{height:10px;border-radius:99px;background:#2c3039;overflow:hidden}
.xbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4d4d,#ff7a5c);border-radius:99px;transition:width .2s}
.xbar.ind i{width:35%!important;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.xd{font-size:14px;color:var(--mute);line-height:1.45}
.xd b{color:var(--ink);font-weight:600}
.xfer.ok .xbar i{background:#3ecf8e}
.xfer.err .xbar i{background:#6b7180}
.cdot img{width:100%;height:100%;object-fit:cover}
.cpill .cdot{overflow:hidden}
.catpv{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;overflow:hidden;flex:none}
.catpv svg.i{width:30px;height:30px}.catpv img{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){
  .xbody{grid-template-columns:minmax(0,1fr)}
  .xtool .ghost.ttog{display:grid}
  .xtree{display:none;border-right:0;border-bottom:1px solid var(--line);max-height:46vh}
  .xp.treeon .xtree{display:block}
  .chead{display:none}
  .crow{grid-template-columns:44px minmax(0,1fr) 40px;padding:8px}
  .crow .csz,.crow .cby,.crow .cdt{display:none}
  .crow .sub{display:block;font-size:13px}
}
@media(max-width:700px){.xfer{right:12px;bottom:84px}.xtool{padding:8px}.xtool .ghost .lbl,.xtool label.btn .lbl{display:none}.cgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
@media(max-width:700px){.cpill{min-height:42px}.cpill .cdot{width:30px;height:30px}.cedit span{display:none}.crow{padding:10px}.cth{width:40px;height:40px}}
</style>
</head>
<body class="out">

<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ff4d4d"/><path d="M16 5l9 5v12l-9 5-9-5V10z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M11.5 16.5l3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <section class="view" id="v-cloud">

const eq={cv:$('eq'),bars:[],an:null,buf:null,audio:null,ctx:null};
{
  const cv=eq.cv,g=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,perm=[];
  const shuffle=n=>{let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;perm=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}};
  const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);if(eq.start)eq.start()};
  addEventListener('resize',size);size();
  const frame=ts=>{
    const t=ts/1000,bw=W<700?6:9,gap=W<700?4:6,n=Math.ceil(W/(bw+gap)),maxH=H*0.55;
    if(perm.length!==n)shuffle(n);
    let data=null;if(eq.an&&eq.audio&&!eq.audio.paused){eq.an.getByteFrequencyData(eq.buf);data=eq.buf}
    const beat=Math.exp(-((t*2.05)%1)*6),beat2=Math.exp(-((t*2.05+0.5)%1)*9)*0.5;
    g.clearRect(0,0,W,H);
    for(let i=0;i<n;i++){
      let v;
      const pi=perm[i];
      if(data){const bin=Math.min(data.length-1,Math.floor(Math.pow(pi/n,1.7)*data.length*0.85));v=data[bin]/255;v=v*v*1.15}
      else v=0;
      const prev=eq.bars[i]||0,nv=v>prev?v:prev*0.9+v*0.1;eq.bars[i]=nv;
      const h=Math.max(3,nv*maxH),x=i*(bw+gap),y=H-h;
      const gr=g.createLinearGradient(0,y,0,H);gr.addColorStop(0,'rgba(255,77,77,0.30)');gr.addColorStop(1,'rgba(255,77,77,0.04)');
      g.fillStyle=gr;g.fillRect(x,y,bw,h);
      g.fillStyle='rgba(255,120,120,0.45)';g.fillRect(x,y-4,bw,2);
    }
    if(data||eq.bars.some(b=>b>0.004))requestAnimationFrame(frame);else eq.run=false;
  };

async function signAll(){
  const need=new Set();
  for(const t of TASKS)for(const f of (Array.isArray(t.files)?t.files:[]))if(f&&f.path&&!URLS[f.path])need.add(f.path);
  for(const id in PR)if(PR[id].photo&&!URLS[PR[id].photo])need.add(PR[id].photo);
  for(const c of CATS)if(c.image&&!URLS[c.image])need.add(c.image);
  if(!need.size)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls([...need],6*3600);
  (data||[]).forEach(d=>{if(d&&d.signedUrl&&d.path)URLS[d.path]=d.signedUrl});
}

function prep(fs){const out=[];for(const f of fs){if(f.size>MAXB){toast('« '+(f.name||'fichier')+' » dépasse 50 Mo.');continue}
  const name=f.name&&f.name!=='image.png'?f.name:'capture-'+new Date().toLocaleString('fr-FR').replace(/[/: ]/g,'-').replace(/,/g,'')+'.png';
  out.push({file:f,type:f.type||'application/octet-stream',name})}return out}
async function upload(p){

  const path=me+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;

    const dep=new Map([x,...ds].map(a=>[a.id,cloudTrail(a.id).length]));const all=[x,...ds].sort((a,b)=>dep.get(b.id)-dep.get(a.id));
    const ids=new Set(all.map(a=>a.id)),paths=all.flatMap(a=>partsOf(a));
    CLOUD=CLOUD.filter(c=>!ids.has(c.id));if(ids.has(cdir))cdir=x.parent_id||'';paintCloud();
    run(async()=>{for(const a of all)chk(await sb.from('cloud_items').delete().eq('id',a.id));if(paths.length)await removePaths(paths)})});
}
document.addEventListener('click',ev=>{
  const dc=ev.target.closest('[data-dlgclose]');if(dc&&(dc.tagName==='BUTTON'||ev.target===dc)){closeDlg();return}
  if(cmenu&&!ev.target.closest('.cmenu')&&!ev.target.closest('[data-cmenu]')){cmenu=null;paintCloud()}
  const b=ev.target.closest('button');if(!b)return;const ds=b.dataset;
  if(b.classList.contains('cpill')&&'cat' in ds){if(ds.cat!==cat)setCat(ds.cat);return}
  if(ds.newcat){catDlg(null);return}
  if(ds.editcat){const c=catOf(cat);if(c&&c.owner===me)catDlg(c);return}
  if(ds.cv){setCview(ds.cv);return}
  if(ds.ctog){if(xopen.has(ds.ctog))xopen.delete(ds.ctog);else xopen.add(ds.ctog);paintCloud();return}
  if('cdir' in ds){goDir(ds.cdir);return}
  if(ds.cmenu){cmenu=cmenu===ds.cmenu?null:ds.cmenu;paintCloud();if(cmenu){const f=$('cloud').querySelector('.cmenu button');f&&f.focus()}return}
  if(ds.copen){const x=CLOUD.find(c=>c.id===ds.copen);if(!x)return;if(x.kind==='folder')goDir(x.id);else previewDlg(x);return}
  if(ds.cact){const x=CLOUD.find(c=>c.id===ds.id);cmenu=null;paintCloud();if(!x)return;
    if(ds.cact==='open')goDir(x.id);
    else if(ds.cact==='view')previewDlg(x);
    else if(ds.cact==='dl')cdownload(x);
    else if(ds.cact==='ren'&&x.owner===me)nameDlg('Renommer',x.name,'Renommer',n=>{if(n===x.name)return;const nn=uniqName(n,x.parent_id||'',x.id);x.name=nn;paintCloud();run(async()=>chk(await sb.from('cloud_items').update({name:nn,updated_at:new Date().toISOString()}).eq('id',x.id)))});
    else if(ds.cact==='mv'&&x.owner===me)moveDlg(x);
    else if(ds.cact==='rm'&&x.owner===me)cdelete(x);
    return}
});

/* ---------- clics ---------- */
document.addEventListener('click',ev=>{
  if(openDD&&!ev.target.closest('.dd')){openDD=null;ddAll()}

  if(ds.dd){openDD=openDD===ds.dd?null:ds.dd;ddAll();if(openDD){const o=$(openDD).querySelector('.ddm .on')||$(openDD).querySelector('.ddm button');o&&o.focus()}return}
  if(ds.ddo){dd[ds.ddo].v=ds.val;openDD=null;ddAll();$(ds.ddo).querySelector('.ddb').focus();if(ds.ddo==='flist')render();return}
  if(ds.tab){const t=ds.tab;if(t===tab)return;guard(()=>{location.hash=t;setTab(t)});return}
  if(ds.pcancel){prof=null;applyProfileMusic();paintProf($('pform'),false);return}
  if(ds.pdefmus){prof.music='';prof.music_name='';setMusic(DEFAULT_MUSIC[0],DEFAULT_MUSIC[0],DEFAULT_MUSIC[1]);rerenderProf();return}
  if(ds.t){openT=ds.t;armed=null;renderModal();return}
  if(ds.li){licon=ds.li;pickers();return}
  if(ds.ti){ticon=ds.ti;pickers();return}
  if(ds.d){tdiff=+ds.d;pickers();return}
  if(ds.u){turg=+ds.u;pickers();return}
  if(ds.fs){fstat=ds.fs;pickers();render();return}
  if(ds.ms){mstat=ds.ms;pickers();render();return}
  if(ds.pi){prof.icon=ds.pi;prof.photo='';rerenderProf();return}
  if(ds.pc){prof.color=ds.pc;rerenderProf();return}
  if(ds.pnophoto){prof.photo='';rerenderProf();return}
  if(ds.later){later=true;renderModal();return}
  if(ds.rp){const p=pend.splice(+ds.rp,1)[0];if(p&&p.local)URL.revokeObjectURL(p.local);render();return}
  if(ds.rf){const t=findT(openT);if(!t||t.uid!==me)return;const files=[...t.files];const gone=files.splice(+ds.rf,1)[0];
    run(async()=>{chk(await sb.from('tasks').update({files}).eq('id',t.id));if(gone&&gone.path)await sb.storage.from(BUCKET).remove([gone.path])});return}
  if(ds.open){const v=ds.open;guard(()=>{dd.flist.v=v;location.hash='taches';setTab('taches')});return}
  if(ds.c){const id=ds.c,row=TASKS.find(x=>x.id===id);if(row){row.done_at=row.done_at?null:new Date().toISOString();render()}
    run(async()=>chk(await sb.rpc('toggle_done',{tid:id})));return}
  if(ds.x){if(armed!==ds.x){armed=ds.x;render();return}
    armed=null;const t=findT(ds.x);if(!t)return;TASKS=TASKS.filter(x=>x.id!==t.id);render();
    run(async()=>{chk(await sb.from('tasks').delete().eq('id',t.id));const paths=t.files.map(f=>f.path).filter(Boolean);if(paths.length)await sb.storage.from(BUCKET).remove(paths)});return}
  if(ds.dl){if(armed!=='L'+ds.dl){armed='L'+ds.dl;render();return}
    armed=null;const id=ds.dl;const mt=allTasks().filter(t=>t.list===id&&t.uid===me);
    run(async()=>{const paths=mt.flatMap(t=>t.files.map(f=>f.path)).filter(Boolean);
      if(mt.length)chk(await sb.from('tasks').delete().in('id',mt.map(t=>t.id)));
      chk(await sb.from('lists').delete().eq('id',id));if(paths.length)await sb.storage.from(BUCKET).remove(paths)});return}
});
$('logout').addEventListener('click',()=>guard(()=>sb.auth.signOut()));
const WARN='<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>';
function isDirty(){if(!session)return false;if(tab==='creer')return !!($('ttitle').value.trim()||pend.length||$('lname').value.trim());if(tab==='profil')return profDirty();return false}
function discard(){if(tab==='creer'){$('ttitle').value='';$('lname').value='';pend.forEach(p=>p.local&&URL.revokeObjectURL(p.local));pend=[]}if(tab==='profil'){prof=null;applyProfileMusic()}}
function guard(go){if(!isDirty()){go();return}
  const c=$('confirm'),pf=tab==='profil';
  c.innerHTML='<div class="ov"><div class="modal cf" role="alertdialog" aria-modal="true" aria-labelledby="cft" aria-describedby="cfd"><div class="cfi">'+sv(WARN)+'</div><h3 id="cft">Modifications non enregistrées</h3><p class="sub" id="cfd" style="font-size:15px;margin:0">'+(pf?'Tu as modifié ton profil sans l’enregistrer.':'Tu as commencé à remplir un formulaire sans le valider.')+' Si tu quittes maintenant, ces changements seront perdus.</p><div class="acts"><button type="button" class="ghost" id="cfleave">Quitter sans enregistrer</button>'+(pf?'<button type="button" class="ghost" id="cfstay">Rester</button><button type="button" class="btn" id="cfsave">Enregistrer et continuer</button>':'<button type="button" class="btn" id="cfstay">Rester</button>')+'</div></div></div>';
  $('cfstay').onclick=()=>{c.innerHTML=''};
  $('cfleave').onclick=()=>{c.innerHTML='';discard();go()};
  if(pf)$('cfsave').onclick=()=>{c.innerHTML='';if(saveProfile($('pform')))go()};
  $('cfstay').focus();
}
addEventListener('beforeunload',e=>{if(isDirty()||XF.on){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('confirm').innerHTML){$('confirm').innerHTML='';return}
  if(e.key==='Escape'&&$('dlg').innerHTML){closeDlg();return}
  if(e.key==='Escape'&&cmenu){const id=cmenu;cmenu=null;paintCloud();const b=document.querySelector('[data-cmenu="'+id+'"]');b&&b.focus();return}
  if(e.key==='Escape'){const z=document.querySelector('.lb2');if(z){z.remove();return}if(openDD){const id=openDD;openDD=null;ddAll();$(id).querySelector('.ddb').focus();return}if(openT){openT=null;renderModal()}}
  if(openDD&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const bs=[...$(openDD).querySelectorAll('.ddm button')];const i=bs.indexOf(document.activeElement);const n=bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length];n&&n.focus()}
});
function rerenderProf(){const el=$('oform')||(tab==='profil'?$('pform'):null);if(el)paintProf(el,el.id==='oform')}
document.addEventListener('input',e=>{if(!prof)return;
  if(e.target.id==='ppseudo'){prof.pseudo=e.target.value;const p=e.target.closest('form').querySelector('#pprev');if(p)p.textContent=e.target.value.trim()||'Ton pseudo';updDirty()}
  if(e.target.id==='pvol'){prof.volume=+e.target.value;$('pvolv').textContent=prof.volume+' %';mus.vol=prof.volume/100;applyVol();updDirty()}});
document.addEventListener('change',async e=>{
  if(e.target.id==='pmusic'){const f=e.target.files[0];e.target.value='';if(!f)return;
    if(!/^audio\//.test(f.type)&&!/\.(mp3|ogg|wav|m4a|aac|flac|opus|webm)$/i.test(f.name)){toast('Choisis un fichier audio (mp3, ogg, wav…).');return}
    const p=prep([f])[0];if(!p)return;busy='music';rerenderProf();
    try{const r=await upload(p);const {data}=await sb.storage.from(BUCKET).createSignedUrl(r.path,6*3600);if(data)URLS[r.path]=data.signedUrl;
      prof.music=r.path;prof.music_name=f.name.replace(/\.[^.]+$/,'').slice(0,80);setMusic(r.path,URLS[r.path],prof.music_name);toast('Musique prête : enregistre pour la garder.')}
    catch(err){toast(frErr(err))}finally{busy=false;rerenderProf()}
    return}
  if(e.target.id!=='pphoto')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!/^image\//.test(f.type)){toast('Choisis une image.');return}
  const p=prep([f])[0];if(!p)return;busy='photo';rerenderProf();
  try{const r=await upload(p);const {data}=await sb.storage.from(BUCKET).createSignedUrl(r.path,6*3600);if(data)URLS[r.path]=data.signedUrl;prof.photo=r.path}
  catch(err){toast(frErr(err))}finally{busy=false;rerenderProf()}
});
function saveProfile(f){
  if(!prof||busy)return false;
  const pseudo=(prof.pseudo||'').trim().slice(0,30);if(!pseudo){const i=f.querySelector('#ppseudo');i&&i.focus();toast('Choisis un pseudo.');return false}
  const full=f.id==='pform',old={...(PR[me]||{})},row={id:me,pseudo,icon:prof.icon,color:prof.color,photo:prof.photo||''};
  if(full){row.music=prof.music||'';row.music_name=prof.music_name||'';row.volume=Math.max(0,Math.min(100,Math.round(prof.volume)))}
  PR[me]={...old,...row};prof=null;
  if(f.id==='oform')$('modal').innerHTML='';
  if(full)$('pform').innerHTML='';
  run(async()=>{chk(await sb.from('profiles').upsert(row));toast('Profil enregistré');
    const gone=[];if(old.photo&&old.photo!==row.photo)gone.push(old.photo);if(full&&old.music&&old.music!==row.music)gone.push(old.music);
    if(gone.length)await sb.storage.from(BUCKET).remove(gone)});
  render();return true;
}
document.addEventListener('submit',e=>{
  const f=e.target;if(f.id!=='pform'&&f.id!=='oform')return;e.preventDefault();saveProfile(f);
});
$('lform').addEventListener('submit',e=>{
  e.preventDefault();const n=$('lname').value.trim();if(!n){$('lname').focus();return}
  $('lname').value='';
  run(async()=>{const r=chk(await sb.from('lists').insert({owner:me,name:n.slice(0,60),icon:licon,...(v2?{category_id:cat||null}:{})}).select().single());dd.tlist.v=r.data.id;toast('Liste « '+n.slice(0,60)+' » créée')});
});
$('tform').addEventListener('submit',e=>{
  e.preventDefault();const title=$('ttitle').value.trim(),list=dd.tlist.v;
  if(!title){$('ttitle').focus();return}
  if(!list||busy)return;
  const row={owner:me,title:title.slice(0,120),icon:ticon,diff:tdiff,urg:turg,assignee:dd.twho.v||null,list_id:list,files:[],...(v2?{category_id:cat||null}:{})};
  const toUp=pend;pend=[];busy=true;$('ttitle').value='';$('taddb').textContent=toUp.length?'Envoi des fichiers…':'Ajout…';render();
  run(async()=>{try{for(const p of toUp){row.files.push(await upload(p));if(p.local)URL.revokeObjectURL(p.local)}
    chk(await sb.from('tasks').insert(row));toast('Tâche ajoutée')}
    catch(err){pend=toUp;$('ttitle').value=title;throw err}
    finally{busy=false;$('taddb').textContent='Ajouter la tâche'}});
});

/* ---------- connexion ---------- */
function paintAuth(){
  [...$('amode').children].forEach(b=>b.classList.toggle('on',b.dataset.am===amode));
  $('atitle').textContent=amode==='in'?'Connexion':'Créer un compte';
  $('abtn').textContent=amode==='in'?'Se connecter':'Créer mon compte';
  $('apass').autocomplete=amode==='in'?'current-password':'new-password';$('amsg').textContent=sb?'':'Le site n’est pas encore relié à Supabase : il manque les clés dans config.js.';
}
$('aauto').checked=autoOn();
paintAuth();
{const EYE='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',EYEX=EYE+'<path d="M3 3l18 18"/>';
 const paintEye=()=>{const shown=$('apass').type==='text';$('aeye').innerHTML=sv(shown?EYEX:EYE);$('aeye').setAttribute('aria-pressed',shown);$('aeye').setAttribute('aria-label',shown?'Masquer le mot de passe':'Afficher le mot de passe')};
 paintEye();$('aeye').addEventListener('click',()=>{const i=$('apass');i.type=i.type==='password'?'text':'password';paintEye();i.focus()});}
$('aform').addEventListener('submit',async e=>{
  e.preventDefault();if(!sb)return;const pseudo=$('apseudo').value.trim().slice(0,30),password=$('apass').value,msg=$('amsg');
  const login=loginOf(pseudo);
  if(login.length<2){msg.textContent='Le pseudo doit contenir au moins 2 lettres ou chiffres.';$('apseudo').focus();return}
  const email=login+LOGIN_DOMAIN;
  try{localStorage.setItem(AUTO_KEY,$('aauto').checked?'1':'0')}catch(e){}
  $('abtn').disabled=true;msg.textContent='';
  try{
    if(amode==='in'){chk(await sb.auth.signInWithPassword({email,password}))}
    else{const r=chk(await sb.auth.signUp({email,password,options:{data:{pseudo,login}}}));
      if(!r.data.session){amode='in';paintAuth();msg.textContent='Compte créé, mais l’administrateur doit désactiver « Confirm email » dans Supabase pour que tu puisses te connecter.'}}
  }catch(err){msg.textContent=frErr(err)}finally{$('abtn').disabled=false}
});
function onSession(s){
  const was=me;session=s;me=s?s.user.id:null;
  if(!s){if(XF.abort)XF.abort();$('xfer').hidden=true;loaded=false;LISTS=[];TASKS=[];CATS=[];CLOUD=[];cdir='';cmenu=null;closeDlg();prof=null;for(const k in PR)delete PR[k];if(chan){sb.removeChannel(chan);chan=null}stopMusic();mus.key='';$('intro').innerHTML='';$('confirm').innerHTML='';setTab('auth');return}
  if(was===me)return;
  loaded=false;later=false;cview=(s.user.user_metadata&&s.user.user_metadata.cloud_view)==='grid'?'grid':'list';
  if(!chan)chan=sb.channel('forge').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},reload).on('postgres_changes',{event:'*',schema:'public',table:'lists'},reload).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},reload).on('postgres_changes',{event:'*',schema:'public',table:'categories'},reload).on('postgres_changes',{event:'*',schema:'public',table:'cloud_items'},reload).subscribe();
  setTab(location.hash.slice(1));$('status').textContent='';
  playIntro(()=>tryPlay());
  loadAll().catch(e=>{$('status').textContent='Impossible de charger les données : '+frErr(e)});
}
addEventListener('hashchange',()=>{if(!session)return;const t=location.hash.slice(1);if(t===tab)return;if(isDirty()){history.replaceState(null,'','#'+tab);guard(()=>{location.hash=t;setTab(t)})}else setTab(t)});
if(!sb){$('amsg').textContent=window.supabase?'Le site n’est pas encore configuré : remplis config.js (voir README).':'Impossible de charger Supabase. Vérifie ta connexion.';$('abtn').disabled=true;render()}
else{sb.auth.getSession().then(({data})=>onSession(data.session));sb.auth.onAuthStateChange((_e,s)=>onSession(s))}
}
